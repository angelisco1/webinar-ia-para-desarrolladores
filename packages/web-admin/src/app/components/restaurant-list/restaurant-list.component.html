<div class="fade-in">
  <div class="page-header">
    <h1>Restaurantes</h1>
    <a routerLink="/restaurants/new" class="btn btn-primary">
      <lucide-icon name="plus" [size]="16"></lucide-icon>
      Nuevo restaurante
    </a>
  </div>

  <div class="spinner" *ngIf="dataService.loading"></div>

  <div class="empty-state card" *ngIf="!dataService.loading && dataService.restaurants.length == 0">
    <lucide-icon name="utensils" [size]="40"></lucide-icon>
    <p>No hay restaurantes registrados</p>
  </div>

  <div class="card table-container" *ngIf="!dataService.loading && dataService.restaurants.length > 0">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Dirección</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Propietario</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of dataService.restaurants">
          <td>
            <div class="restaurant-name">
              <img *ngIf="r.logoUrl" [src]="r.logoUrl" class="restaurant-logo" />
              <span>{{ r.name }}</span>
            </div>
          </td>
          <td>{{ r.address }}</td>
          <td>{{ r.email }}</td>
          <td>{{ r.phone }}</td>
          <td>{{ r.ownerFirstName + ' ' + r.ownerLastName }}</td>
          <td>
            <div class="actions">
              <a [routerLink]="'/restaurants/' + r.id + '/edit'" class="btn btn-secondary btn-sm">
                <lucide-icon name="edit" [size]="14"></lucide-icon>
                Editar
              </a>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
