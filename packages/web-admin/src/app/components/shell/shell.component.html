<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="/assets/images/logo.png" alt="RestTek" class="logo-img">
      <span>RestTek</span>
    </div>

    <nav class="sidebar-nav">
      <a *ngIf="user.role == 'admin'" routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <lucide-icon name="layout-dashboard" [size]="18"></lucide-icon>
        <span>Dashboard</span>
      </a>

      <div class="nav-section-label">Mis restaurantes</div>

      <div *ngFor="let r of restaurants" class="restaurant-group" [ngClass]="{'expanded': expandedRestaurantId == r.id}">
        <button class="nav-item restaurant-toggle" [ngClass]="{'active': expandedRestaurantId == r.id}" (click)="toggleRestaurant(r.id)">
          <lucide-icon name="utensils" [size]="16"></lucide-icon>
          <span class="restaurant-name">{{ r.name }}</span>
          <lucide-icon name="chevron-right" [size]="14" class="chevron"></lucide-icon>
        </button>
        <div class="sub-nav" *ngIf="expandedRestaurantId == r.id">
          <a [routerLink]="'/restaurants/' + r.id + '/dashboard'" routerLinkActive="active" class="sub-nav-item">
            <lucide-icon name="layout-dashboard" [size]="14"></lucide-icon>
            <span>Dashboard</span>
          </a>
          <a [routerLink]="'/restaurants/' + r.id + '/dishes'" routerLinkActive="active" class="sub-nav-item">
            <lucide-icon name="utensils" [size]="14"></lucide-icon>
            <span>Platos</span>
          </a>
          <a [routerLink]="'/restaurants/' + r.id + '/ingredients'" routerLinkActive="active" class="sub-nav-item">
            <lucide-icon name="package" [size]="14"></lucide-icon>
            <span>Ingredientes</span>
          </a>
          <a [routerLink]="'/restaurants/' + r.id + '/employees'" routerLinkActive="active" class="sub-nav-item">
            <lucide-icon name="users" [size]="14"></lucide-icon>
            <span>Empleados</span>
          </a>
          <a [routerLink]="'/restaurants/' + r.id + '/edit'" routerLinkActive="active" class="sub-nav-item">
            <lucide-icon name="settings" [size]="14"></lucide-icon>
            <span>Configuración</span>
          </a>
        </div>
      </div>

      <div class="nav-loading" *ngIf="loading">Cargando...</div>
      <div class="nav-empty" *ngIf="restaurants.length == 0 && !loading">Sin restaurantes</div>

      <a *ngIf="user.role == 'admin'" routerLink="/restaurants/new" class="nav-item nav-add">
        <lucide-icon name="plus" [size]="16"></lucide-icon>
        <span>Nuevo restaurante</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">{{ user.firstName.charAt(0) }}</div>
        <div class="user-details">
          <span class="user-name">{{ user.firstName + ' ' + user.lastName }}</span>
          <span class="user-role">{{ user.role }}</span>
        </div>
      </div>
      <button class="btn-logout" aria-label="Cerrar sesión" (click)="logout()">
        <lucide-icon name="log-out" [size]="16" aria-hidden="true"></lucide-icon>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
