<div class="ingredients-section">
  <b>Ingredientes del plato</b>

  <div class="ingredient-chips" *ngIf="selected().length > 0">
    <div class="ingredient-chip" *ngFor="let ing of selected()">
      <span>{{ label(ing.ingredientId) }} — {{ ing.quantity }}</span>
      <button type="button" class="chip-remove" [attr.aria-label]="'Quitar ' + label(ing.ingredientId)" (click)="remove(ing.ingredientId)">
        <lucide-icon name="trash-2" [size]="14" aria-hidden="true"></lucide-icon>
      </button>
    </div>
  </div>

  <div class="add-ingredient-row">
    <div class="form-group ingredient-select">
      <label for="dish-ingredient">Ingrediente</label>
      <select id="dish-ingredient" class="form-control" [(ngModel)]="newIngredientId" name="newIngredientId" (keydown.enter)="$event.preventDefault(); add()">
        <option value="">Selecciona un ingrediente</option>
        <option *ngFor="let i of all()" [value]="i.id">{{ i.name }} ({{ i.unit }})</option>
      </select>
    </div>
    <div class="form-group">
      <label for="dish-ingredient-qty">Cantidad</label>
      <input id="dish-ingredient-qty" type="number" class="form-control qty-input" [(ngModel)]="newIngredientQty" name="newIngredientQty" min="0.1" step="0.1" (keydown.enter)="$event.preventDefault(); add()" />
    </div>
    <button type="button" class="btn btn-secondary btn-sm add-ingredient-btn" aria-label="Añadir ingrediente" (click)="add()">
      <lucide-icon name="plus" [size]="14" aria-hidden="true"></lucide-icon>
    </button>
  </div>
</div>
