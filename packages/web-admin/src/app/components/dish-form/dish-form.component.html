<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="'/restaurants/' + restaurantId + '/dishes'" class="back-link" aria-label="Volver a platos">
        <lucide-icon name="chevron-left" [size]="18" aria-hidden="true"></lucide-icon>
      </a>
      <h1 class="title">{{ isEditing ? 'Editar plato' : 'Nuevo plato' }}</h1>
    </div>
  </div>

  <div role="alert" class="toast-region">
    <div class="toast-error" *ngIf="error">
      <lucide-icon name="alert-circle" [size]="16" aria-hidden="true"></lucide-icon>
      <span>{{ error }}</span>
      <button type="button" class="toast-close" aria-label="Cerrar aviso" (click)="error = null">
        <lucide-icon name="x" [size]="14" aria-hidden="true"></lucide-icon>
      </button>
    </div>
  </div>

  <form class="card form-card" (ngSubmit)="save()" novalidate>
    <p class="required-legend">* obligatorio</p>
    <div class="form-grid">
      <div class="form-group">
        <label for="dish-name">Nombre del plato <span aria-hidden="true">*</span></label>
        <input id="dish-name" [appAutofocus]="!isEditing" type="text" class="form-control" [ngClass]="{'invalid': errors.name}" [(ngModel)]="dish.name" (ngModelChange)="onFieldChange()" [attr.aria-invalid]="errors.name ? 'true' : null" [attr.aria-describedby]="errors.name ? 'dish-name-error' : null" name="name" placeholder="Nombre del plato *" autocomplete="off" required aria-required="true" />
        <p id="dish-name-error" class="field-error" *ngIf="errors.name">
          <lucide-icon name="alert-circle" [size]="14" aria-hidden="true"></lucide-icon> Indica el nombre del plato
        </p>
      </div>

      <div class="form-group">
        <label for="dish-price">Precio (€) <span aria-hidden="true">*</span></label>
        <input id="dish-price" type="text" inputmode="decimal" class="form-control" [ngClass]="{'invalid': errors.price}" [(ngModel)]="dish.price" (ngModelChange)="onFieldChange()" [attr.aria-invalid]="errors.price ? 'true' : null" name="price" placeholder="Precio (€) *" autocomplete="off" required aria-required="true" [attr.aria-describedby]="errors.price ? 'dish-price-hint dish-price-error' : 'dish-price-hint'" />
        <span id="dish-price-hint" class="field-hint">Usa punto decimal (12.5)</span>
        <p id="dish-price-error" class="field-error" *ngIf="errors.price">
          <lucide-icon name="alert-circle" [size]="14" aria-hidden="true"></lucide-icon> Introduce un precio mayor que 0
        </p>
      </div>

      <fieldset class="form-group category-group">
        <legend class="label">Categoría</legend>
        <div class="chips">
          <button type="button" *ngFor="let c of categories" class="chip" [ngClass]="{'selected': dish.category == c}" [attr.aria-pressed]="dish.category == c" (click)="selectCategory(c)">
            <lucide-icon *ngIf="dish.category == c" class="chip-check" name="check" [size]="12" aria-hidden="true"></lucide-icon>
            {{ c | categoryLabel }}
          </button>
        </div>
      </fieldset>

      <div class="form-group" role="group" aria-labelledby="dish-available-label">
        <span class="label" id="dish-available-label">Disponible</span>
        <button type="button" role="switch" class="toggle" [ngClass]="{'on': dish.available}" [attr.aria-checked]="dish.available" aria-labelledby="dish-available-label" (click)="toggleAvailable()">
          <span class="toggle-dot" aria-hidden="true"></span>
          <span class="toggle-text">{{ dish.available ? 'Sí' : 'No' }}</span>
        </button>
      </div>

      <div class="form-group form-full">
        <label for="dish-description">Descripción</label>
        <textarea id="dish-description" class="form-control" [(ngModel)]="dish.description" name="description" rows="3" placeholder="Descripción"></textarea>
      </div>
    </div>

    <app-dish-ingredients-editor [all]="allIngredients" [selected]="dish.ingredients" (selectedChange)="dish.ingredients = $event"></app-dish-ingredients-editor>

    <div class="form-actions">
      <a [routerLink]="'/restaurants/' + restaurantId + '/dishes'" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
