<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="'/restaurants/' + restaurantId + '/dishes'" class="back-link">
        <lucide-icon name="chevron-left" [size]="18"></lucide-icon>
      </a>
      <div class="title">{{ isEditing ? 'Editar plato' : 'Nuevo plato' }}</div>
    </div>
  </div>

  <div class="toast-error" *ngIf="error">{{ error }}</div>

  <form class="card form-card">
    <div class="form-grid">
      <div class="form-group">
        <input id="dish-name" [appAutofocus]="!isEditing" type="text" class="form-control" [ngClass]="{'invalid': errors.name}" [(ngModel)]="dish.name" name="name" placeholder="Nombre del plato *" autocomplete="off" />
      </div>

      <div class="form-group">
        <input type="text" class="form-control" [ngClass]="{'invalid': errors.price}" [(ngModel)]="dish.price" name="price" placeholder="Precio (€) *" autocomplete="off" />
      </div>

      <div class="form-group">
        <span class="label">Categoría</span>
        <div class="chips">
          <div *ngFor="let c of categories" class="chip" [ngClass]="{'selected': dish.category == c}" (click)="selectCategory(c)">
            {{ c | categoryLabel }}
          </div>
        </div>
      </div>

      <div class="form-group">
        <span class="label">Disponible</span>
        <div class="toggle" [ngClass]="{'on': dish.available}" (click)="toggleAvailable()">
          <div class="toggle-dot"></div>
        </div>
      </div>

      <div class="form-group form-full">
        <textarea class="form-control" [(ngModel)]="dish.description" name="description" rows="3" placeholder="Descripción" tabindex="1"></textarea>
      </div>
    </div>

    <app-dish-ingredients-editor [all]="allIngredients" [selected]="dish.ingredients" (selectedChange)="dish.ingredients = $event"></app-dish-ingredients-editor>

    <div class="form-actions">
      <a [routerLink]="'/restaurants/' + restaurantId + '/dishes'" class="btn btn-secondary">Cancelar</a>
      <div class="btn btn-primary" [ngClass]="{'disabled': loading}" (click)="save()">
        {{ loading ? 'Guardando...' : 'Guardar' }}
      </div>
    </div>
  </form>
</div>
