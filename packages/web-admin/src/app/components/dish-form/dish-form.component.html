<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="'/restaurants/' + restaurantId + '/dishes'" class="back-link" aria-label="Volver a platos">
        <lucide-icon name="chevron-left" [size]="18" aria-hidden="true"></lucide-icon>
      </a>
      <h1 class="title">{{ isEditing ? 'Editar plato' : 'Nuevo plato' }}</h1>
    </div>
  </div>

  <div class="toast-error" *ngIf="error">{{ error }}</div>

  <form class="card form-card" novalidate>
    <p class="required-legend">* obligatorio</p>
    <div class="form-grid">
      <div class="form-group">
        <label for="dish-name">Nombre del plato <span aria-hidden="true">*</span></label>
        <input id="dish-name" type="text" class="form-control" [ngClass]="{'invalid': errors.name}" [(ngModel)]="dish.name" name="name" placeholder="Nombre del plato *" autocomplete="off" required aria-required="true" />
      </div>

      <div class="form-group">
        <label for="dish-price">Precio (€) <span aria-hidden="true">*</span></label>
        <input id="dish-price" type="text" inputmode="decimal" class="form-control" [ngClass]="{'invalid': errors.price}" [(ngModel)]="dish.price" name="price" placeholder="Precio (€) *" autocomplete="off" required aria-required="true" aria-describedby="dish-price-hint" />
        <span id="dish-price-hint" class="field-hint">Usa punto decimal (12.5)</span>
      </div>

      <fieldset class="form-group category-group">
        <legend class="label">Categoría</legend>
        <div class="chips">
          <button type="button" *ngFor="let c of categories" class="chip" [ngClass]="{'selected': dish.category == c}" [attr.aria-pressed]="dish.category == c" (click)="selectCategory(c)">
            <lucide-icon *ngIf="dish.category == c" class="chip-check" name="check" [size]="12" aria-hidden="true"></lucide-icon>
            {{ dataService.getCategoryLabel(c) }}
          </button>
        </div>
      </fieldset>

      <div class="form-group">
        <span class="label">Disponible</span>
        <div class="toggle" [ngClass]="{'on': dish.available}" (click)="toggleAvailable()">
          <div class="toggle-dot"></div>
        </div>
      </div>

      <div class="form-group form-full">
        <label for="dish-description">Descripción</label>
        <textarea id="dish-description" class="form-control" [(ngModel)]="dish.description" name="description" rows="3" placeholder="Descripción"></textarea>
      </div>
    </div>

    <div class="ingredients-section">
      <b>Ingredientes del plato</b>

      <div class="ingredient-chips" *ngIf="dish.ingredients.length > 0">
        <div class="ingredient-chip" *ngFor="let ing of dish.ingredients">
          <span>{{ getIngredientName(ing.ingredientId) }} — {{ ing.quantity }}</span>
          <span class="chip-remove" (click)="removeIngredient(ing.ingredientId)">
            <lucide-icon name="trash-2" [size]="12"></lucide-icon>
          </span>
        </div>
      </div>

      <div class="add-ingredient-row">
        <select class="form-control" [(ngModel)]="newIngredientId" name="newIngredientId">
          <option value="">--</option>
          <option *ngFor="let i of allIngredients" [value]="i.id">{{ i.name }} ({{ i.unit }})</option>
        </select>
        <input type="number" class="form-control qty-input" [(ngModel)]="newIngredientQty" name="newIngredientQty" min="0.1" step="0.1" />
        <div class="btn btn-secondary btn-sm" (click)="addIngredient()">
          <lucide-icon name="plus" [size]="14"></lucide-icon>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <a [routerLink]="'/restaurants/' + restaurantId + '/dishes'" class="btn btn-secondary">Cancelar</a>
      <div class="btn btn-primary" [ngClass]="{'disabled': loading}" (click)="save()">
        {{ loading ? 'Guardando...' : 'Guardar' }}
      </div>
    </div>
  </form>
</div>
