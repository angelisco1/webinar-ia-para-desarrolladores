<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="'/restaurants/' + restaurantId + '/employees'" class="back-link">
        <lucide-icon name="chevron-left" [size]="18"></lucide-icon>
      </a>
      <h1>Nuevo empleado</h1>
    </div>
  </div>

  <div class="alert-error" *ngIf="error">{{ error }}</div>

  <form (ngSubmit)="save()" class="card form-card">
    <div class="form-grid">
      <div class="form-group">
        <label for="firstName">Nombre</label>
        <input id="firstName" type="text" class="form-control" [(ngModel)]="employee.firstName" name="firstName" placeholder="Juan" />
      </div>

      <div class="form-group">
        <label for="lastName">Apellido</label>
        <input id="lastName" type="text" class="form-control" [(ngModel)]="employee.lastName" name="lastName" placeholder="Pérez" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" class="form-control" [(ngModel)]="employee.email" name="email" placeholder="juan@restaurante.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" class="form-control" [(ngModel)]="employee.password" name="password" placeholder="••••••••" />
      </div>

      <div class="form-group">
        <label for="role">Rol</label>
        <select id="role" class="form-control" [(ngModel)]="employee.role" name="role">
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <a [routerLink]="'/restaurants/' + restaurantId + '/employees'" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Crear empleado' }}
      </button>
    </div>
  </form>
</div>
